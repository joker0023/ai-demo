spring.application.name=ai-demo

server.port=8080

# 本地敏感配置（application-local.properties 已被 .gitignore 忽略，不存在时跳过）
spring.config.import=optional:file:./application-local.properties

spring.ai.chat.client.enabled=false

# Deepseek URL（API Key 从环境变量 DEEPSEEK_API_KEY 或 application-local.properties 读取）
spring.ai.deepseek.base-url=https://api.deepseek.com
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY}
spring.ai.deepseek.chat.options.model=deepseek-chat

spring.ai.openai.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
spring.ai.openai.api-key=${DASHSCOPE_API_KEY}
spring.ai.openai.chat.options.model=qwen4-max

spring.ai.openai.embedding.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
spring.ai.openai.embedding.api-key=${DASHSCOPE_API_KEY}
spring.ai.openai.embedding.options.model=text-embedding-v4

# Milvus 连接配置
spring.ai.vectorstore.milvus.client.host=127.0.0.1
spring.ai.vectorstore.milvus.client.port=19530
# 认证信息
spring.ai.vectorstore.milvus.client.username=root
spring.ai.vectorstore.milvus.client.password=${MILVUS_PASSWORD:milvus}
# 数据库名称（默认 default）
spring.ai.vectorstore.milvus.database-name=default
# 向量集合名称（自定义，不存在会自动创建）
spring.ai.vectorstore.milvus.collection-name=travel_safety_embedding
# 是否自动初始化 Schema（建议开启）
spring.ai.vectorstore.milvus.initialize-schema=true
# 向量维度（与智普 AI embedding-2 模型一致，为 1024）
spring.ai.vectorstore.milvus.embedding-dimension=1024

spring.ai.mcp.server.name=my-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
